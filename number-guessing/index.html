<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hero">

        <div class="game-card">

            <div class="level">
                LEVEL 1
            </div>

            <h1>NUMBER GUESSING</h1>

            <p>Guess a number between <strong>1 - 100</strong></p>

            <div class="stars">
                ★ ★ ★
            </div>

            <div class="game-panel">

                <div class="input-area">
                    <input 
                        type="number" 
                        placeholder="Enter your number"
                        id="num"
                    >
                </div>

                <button id="guessBtn">
                    GUESS
                </button>

                <div id="result"></div>

                <div id="attempts"></div>

                <button id="resBtn">
                    TRY AGAIN
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
